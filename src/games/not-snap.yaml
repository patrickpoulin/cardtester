# =============================================================================
# Not Snap: a Marvel Snap-style lane battler.
#
# The rules below are fixed; decks change. Each card is just numbers from a
# deck list: cost, power, and optionally one ability (effect + amount). The
# abilities are carried out by the `play` action and `lanePower`, so any deck
# uploaded on the Upload a Deck page plays with the same rules. The cards here
# are the starter deck, the same as the deck template.
# =============================================================================

id: not-snap
name: Not Snap
description: A Marvel Snap-style lane battler. Over 6 turns, play cards to three locations; win two locations to win the game.
players: { min: 2, max: 2 }
scoreLabel: Locations won
scoreOrder: higher

# Seconds a real player takes, used for the playtime estimate.
timing:
  setup: 30
  actions: { play: 8, end-turn: 3 }

# Simplifications compared with Marvel Snap:
# - Players take turns instead of playing at the same time, and a card's
#   On Reveal happens as soon as it's played. Player 1 always acts first each
#   turn, so Player 2 sees what Player 1 did (the report will show whether
#   that is an advantage).
# - Locations are known from the start instead of revealing on turns 1-3.
# - No snapping or cubes: a game is simply won or lost.

# -----------------------------------------------------------------------------
# CARDS: the starter deck. Each player gets one copy of each card.
# effect is one of: draw, boost-here, weaken-here, contested, alone,
# ongoing-boost (see the play action and lanePower), and amount is its number.
# -----------------------------------------------------------------------------
cards:
  - name: Scout
    perPlayer: { count: 1, zone: deck }
    attrs: { cost: 1, power: 2 }
  - name: Lookout
    perPlayer: { count: 1, zone: deck }
    attrs: { cost: 1, power: 1, effect: draw, amount: 1, ability: "On Reveal: draw a card." }
  - name: Squire
    perPlayer: { count: 1, zone: deck }
    attrs: { cost: 2, power: 3 }
  - name: Medic
    perPlayer: { count: 1, zone: deck }
    attrs: { cost: 2, power: 2, effect: boost-here, amount: 1, ability: "On Reveal: your other cards here get +1 power." }
  - name: Trickster
    perPlayer: { count: 1, zone: deck }
    attrs: { cost: 2, power: 1, effect: contested, amount: 3, ability: "On Reveal: if your opponent has a card here, +3 power." }
  - name: Banner Bearer
    perPlayer: { count: 1, zone: deck }
    attrs: { cost: 3, power: 3, effect: ongoing-boost, amount: 1, ability: "Ongoing: your other cards here have +1 power." }
  - name: Saboteur
    perPlayer: { count: 1, zone: deck }
    attrs: { cost: 3, power: 3, effect: weaken-here, amount: 1, ability: "On Reveal: enemy cards here get -1 power." }
  - name: Guard
    perPlayer: { count: 1, zone: deck }
    attrs: { cost: 3, power: 4 }
  - name: Knight
    perPlayer: { count: 1, zone: deck }
    attrs: { cost: 4, power: 6 }
  - name: Siege Engine
    perPlayer: { count: 1, zone: deck }
    attrs: { cost: 4, power: 4, effect: alone, amount: 4, ability: "On Reveal: if this is your only card here, +4 power." }
  - name: Giant
    perPlayer: { count: 1, zone: deck }
    attrs: { cost: 5, power: 9 }
  - name: Dragon
    perPlayer: { count: 1, zone: deck }
    attrs: { cost: 6, power: 12 }

# -----------------------------------------------------------------------------
# ZONES: each player has a deck, a hand, and their side of the three locations.
# -----------------------------------------------------------------------------
zones:
  player:
    deck: { visibility: hidden }
    hand: { visibility: owner }
    lane1: { visibility: public }
    lane2: { visibility: public }
    lane3: { visibility: public }

vars:
  shared:
    snapTurn: 1 # the game turn (1-6); both players act once per turn
  player:
    energy: 0 # refilled to the turn number at the start of each turn

# -----------------------------------------------------------------------------
# DEFINE
# Locations: 1 = Plains (no effect), 2 = Forge (cards played here get +1
# power), 3 = Bog (Ongoing: cards here have -1 power).
# -----------------------------------------------------------------------------
define:
  laneOf: "(p, l) => l == 1 ? p.lane1 : (l == 2 ? p.lane2 : p.lane3)"
  opponent: "p => players[1 - p.index]"
  lanePower: >-
    (p, l) => sum(laneOf(p, l), c => c.power)
      + sum(laneOf(p, l), c => c.effect == 'ongoing-boost' ? c.amount * (len(laneOf(p, l)) - 1) : 0)
      - (l == 3 ? len(laneOf(p, l)) : 0)
  locationsWon: "p => count([1, 2, 3], l => lanePower(p, l) > lanePower(opponent(p), l))"
  totalPower: "p => lanePower(p, 1) + lanePower(p, 2) + lanePower(p, 3)"
  openLanes: "filter([1, 2, 3], l => len(laneOf(me, l)) < 4)" # 4 cards per side, max

# -----------------------------------------------------------------------------
# SETUP AND TURNS: each player shuffles and draws 3. At the start of every turn
# the player draws a card (hand limit 7) and gets energy equal to the turn.
# -----------------------------------------------------------------------------
setup:
  - forEach:
      in: players
      as: p
      do:
        - shuffle: p.deck
        - draw: { from: p.deck, to: p.hand, count: 3 }

turn:
  start:
    - if: "len(me.hand) < 7"
      then:
        - draw: { from: me.deck, to: me.hand }
    - set: { var: me.energy, value: snapTurn }

# -----------------------------------------------------------------------------
# ACTIONS
# -----------------------------------------------------------------------------
actions:
  - id: play
    label: plays
    card: { from: me.hand, where: "card.cost <= me.energy" }
    choose:
      lane: { options: openLanes }
    endsTurn: false # play as many cards as your energy allows
    effects:
      - move: { card: card, to: "laneOf(me, lane)" }
      - add: { var: me.energy, value: -card.cost }
      - if: "lane == 2" # Forge
        then:
          - add: { var: card.power, value: 1 }
      # On Reveal abilities
      - if: "card.effect == 'draw'"
        then:
          - draw: { from: me.deck, to: me.hand, count: "max(0, min(card.amount, 7 - len(me.hand)))" }
      - if: "card.effect == 'boost-here'"
        then:
          - forEach:
              in: "filter(laneOf(me, lane), c => c.id != card.id)"
              as: c
              do:
                - add: { var: c.power, value: card.amount }
      - if: "card.effect == 'weaken-here'"
        then:
          - forEach:
              in: "laneOf(opponent(me), lane)"
              as: c
              do:
                - add: { var: c.power, value: -card.amount }
      - if: "card.effect == 'contested' and len(laneOf(opponent(me), lane)) > 0"
        then:
          - add: { var: card.power, value: card.amount }
      - if: "card.effect == 'alone' and len(laneOf(me, lane)) == 1"
        then:
          - add: { var: card.power, value: card.amount }
    # Prefer strong cards, contested locations, and avoid the Bog.
    score: >-
      10 * (card.power + (card.amount ?? 0) + (lane == 2 ? 1 : 0) - (lane == 3 ? 1 : 0))
        + (lanePower(me, lane) <= lanePower(opponent(me), lane) ? 15 : 0)
        + card.cost

  - id: end-turn
    label: ends their turn
    effects:
      - if: "current == numPlayers - 1" # both players have acted
        then:
          - add: { var: snapTurn, value: 1 }
    score: 0

# -----------------------------------------------------------------------------
# ENDING AND WINNING: after turn 6, whoever wins more locations wins. A tie on
# locations goes to total power; a full tie is a shared win.
# -----------------------------------------------------------------------------
endWhen: "snapTurn > 6"
winners: "highest(players, p => locationsWon(p) * 1000 + totalPower(p))"
score: "locationsWon(p)"
progress: "locationsWon(p) * 1000 + totalPower(p)" # who is ahead mid-game
